name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cold_bootstrap:
        description: Also test live downloads into an empty Nix store
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # NOTE: AppArmor blocks unprivileged user namespaces.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
      - run: nix flake check --print-build-logs
      - if: github.event_name == 'workflow_dispatch' && inputs.cold_bootstrap
        run: nix run .#test-sandbox-cold
