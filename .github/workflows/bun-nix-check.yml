name: Bun + Nix checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile

      - name: Check
        run: nix develop --command bun run check

      - name: Test
        run: nix develop --command bun test

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Detect optional scripts
        id: scripts
        run: |
          nix develop --command bun --eval '
            const { scripts = {} } = await Bun.file("package.json").json();
            console.log("build=" + Object.hasOwn(scripts, "build"));
            console.log("e2e=" + Object.hasOwn(scripts, "test:e2e"));
          ' >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.scripts.outputs.build == 'true'
        run: nix develop --command bun run build

      - name: End-to-end tests
        if: steps.scripts.outputs.e2e == 'true'
        run: nix develop --command bun run test:e2e

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
