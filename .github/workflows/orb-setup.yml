name: Orb setup

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Bootstrap and repeat setup
        run: |
          .agents/setup
          .agents/setup
      - name: Check scripts and exported templates
        shell: bash --login -eo pipefail {0}
        run: |
          shellcheck .agents/setup .agents/resume tests/orb-setup.sh
          bash tests/orb-setup.sh
          nix flake check
